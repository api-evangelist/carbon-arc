components:
  schemas:
    FrameworkEventRequest:
      properties:
        event_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Id
        representation:
          type: string
          title: Representation
        event_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Name
        event_category_id:
          anyOf:
          - type: integer
          - type: string
          - type: 'null'
          title: Event Category Id
      type: object
      required:
      - representation
      title: FrameworkEventRequest
      description: "Minimal event primitive for framework compositions.\n\nWire-layer validator: rejects bad combinations before the request ever\nreaches the framework service, so failures surface as a clean 422 instead\nof bubbling up as a ``PipelineError`` from inside gateau. The canonical\nrule sources live in :mod:`gateau.framework.constants`:\n\n- ``EVENT_REPRESENTATION_TYPES`` — the full set of allowed event reps.\n- ``PARENT_EVENT_REPRESENTATION_TYPES`` — the subset valid when an\n  ``event_id`` is supplied (since ``event_id`` is the parent event id,\n  mapped to fact-table ``parent_event_id``)."
    Body_collection_framework_metadata_v2_framework_metadata_post:
      properties:
        frameworks:
          items:
            $ref: '#/components/schemas/FrameworkRequest'
          type: array
          title: Frameworks
        config:
          anyOf:
          - type: object
          - type: 'null'
          title: Config
      type: object
      required:
      - frameworks
      title: Body_collection_framework_metadata_v2_framework_metadata_post
    DataFrameResponse:
      properties:
        type:
          type: string
          const: dataframe
          title: Type
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        size:
          type: integer
          title: Size
        pages:
          type: integer
          title: Pages
        insight_column:
          anyOf:
          - type: string
          - type: 'null'
          title: Insight Column
        data:
          items:
            type: object
          type: array
          title: Data
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        metadata_info:
          anyOf:
          - type: object
          - type: 'null'
          title: Metadata Info
      type: object
      required:
      - type
      - total
      - page
      - size
      - pages
      - data
      title: DataFrameResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    FrameworkInsightRequest:
      properties:
        insight_id:
          type: integer
          title: Insight Id
        insight_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Insight Name
      type: object
      required:
      - insight_id
      title: FrameworkInsightRequest
    QueryJobResult:
      properties:
        columns:
          items:
            $ref: '#/components/schemas/QueryJobColumn'
          type: array
          title: Columns
        rows:
          items:
            items: {}
            type: array
          type: array
          title: Rows
        row_count:
          type: integer
          title: Row Count
      type: object
      required:
      - columns
      - rows
      - row_count
      title: QueryJobResult
      description: 'A finished job''s rows, in the same column/row *structure* as

        ``SQLQueryResponse`` — columns plus a row matrix — so PRO-3283''s SQL editor

        migration is a rename rather than a reshape. Note the ``type`` caveat above:

        the structure translates, the type vocabulary does not.


        No ``applied_limit``/``limit_injected`` here: those describe a caller''s

        own SQL rewrite, which happens before submission, not anything the job

        knows about. ``truncated`` also isn''t here -- see

        ``QueryJobResponse.truncated`` instead: a done job''s *cached* result can

        now be a worker-applied byte-payload trim (not just a caller''s own

        rewrite), so that flag belongs on the envelope wrapping this, not on the

        row/column structure itself.'
    FrameworkEntityRequest:
      properties:
        carc_id:
          type: integer
          title: Carc Id
        representation:
          type: string
          title: Representation
        entity_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Name
      type: object
      required:
      - carc_id
