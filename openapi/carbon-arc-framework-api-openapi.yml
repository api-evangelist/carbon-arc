openapi: 3.2.0
info:
  title: Carbon Arc API Documentation Framework API
  description: '# Introduction


    Carbon Arc''s Insights Exchange provides a comprehensive consumption-based platform for accessing decision-making data.'
  version: v2
  x-logo:
    url: /static/logo_light.png
tags:
- name: Framework
paths:
  /v2/framework/filters:
    post:
      tags:
      - Framework
      summary: Framework Filters
      description: 'The filter set for a framework.


        The job-polling contract is gone from this route for the common case

        (PRO-3586): the filter_options precompute artifact answers most

        requests, so it runs to completion synchronously under

        settings.framework_filters_timeout_seconds and returns 504 if it

        exceeds that -- no envelope, no added latency.


        PRO-3722: ``poll``/``job_id`` restore the envelope specifically for the

        live-fetch fallback that runs on a precompute coverage miss (a real,

        occasionally very slow path -- see get_framework_filters'' own

        docstring). The precompute/cache-hit path is untouched either way.'
      operationId: framework_filters_v2_framework_filters_post
      parameters:
      - name: poll
        in: query
        required: false
        schema:
          type: boolean
          description: 'Opt into the job-polling contract (PRO-3420): if the operation hasn''t finished within its short submission wait, respond with a QueryJobResponse envelope instead of blocking until it''s done. Callers that don''t pass this keep the original always-blocking behavior unchanged.'
          default: false
          title: Poll
        description: 'Opt into the job-polling contract (PRO-3420): if the operation hasn''t finished within its short submission wait, respond with a QueryJobResponse envelope instead of blocking until it''s done. Callers that don''t pass this keep the original always-blocking behavior unchanged.'
      - name: job_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Finalize a job an earlier poll=true call already submitted, once GET /v2/query-jobs/{job_id} reports it terminal, instead of submitting a new one. The normal response shaping still runs on the result.
          title: Job Id
        description: Finalize a job an earlier poll=true call already submitted, once GET /v2/query-jobs/{job_id} reports it terminal, instead of submitting a new one. The normal response shaping still runs on the result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_framework_filters_v2_framework_filters_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/FrameworkFiltersResponse'
                - $ref: '#/components/schemas/QueryJobResponse'
                title: Response Framework Filters V2 Framework Filters Post
        '404':
          detail: Not found
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/framework/filters/batch:
    post:
      tags:
      - Framework
      summary: Framework Filters Batch
      description: 'Filter sets for many frameworks in one request.


        For callers warming a page of pairs ahead of the configure step. The

        per-item bound is short and failures are reported positionally, so this

        answers with whatever it could get rather than making the caller wait on

        its slowest member -- see ``FrameworkService.get_framework_filters_batch``.


        Always 200 when the request itself is well-formed; per-framework failures

        live in ``results[].error``.'
      operationId: framework_filters_batch_v2_framework_filters_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_framework_filters_batch_v2_framework_filters_batch_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameworkFiltersBatchResponse'
        '404':
          description: Not Found
          detail: Not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/framework/filters/{filter_key}/options:
    post:
      tags:
      - Framework
      summary: Framework Filter Options
      description: 'The selectable values for one filter. Same contract as ``/filters``:

        synchronous, one response type, bounded by

        settings.framework_filters_timeout_seconds (PRO-3586).'
      operationId: framework_filter_options_v2_framework_filters__filter_key__options_post
      parameters:
      - name: filter_key
        in: path
        required: true
        schema:
          type: string
          title: Filter Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_framework_filter_options_v2_framework_filters__filter_key__options_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          detail: Not found
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
