  /v2/ontology/insight-search-ids:
    get:
      tags:
      - Ontology
      summary: Insight Search Ids
      description: 'Semantically-matched insight ids, in relevance order.


        Restores semantic search to the insight pickers (PRO-3373). They had moved

        to substring matching over the in-memory catalog, which cost recall — a

        query matched "employer" but not "employment" — and silently dropped

        everything related-but-not-lexically-similar even on queries that did

        match.


        Search runs against turbopuffer and returns ids only; the client intersects

        against the catalog it already holds, in the order returned. No Neo4j round

        trip happens — ``search_insight`` hydrates hits against the graph inside the

        vector call, and this path uses a graph-free retriever instead, which is what

        moving the corpus into the browser was supposed to buy.'
      operationId: insight_search_ids_v2_ontology_insight_search_ids_get
      parameters:
      - name: search
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          description: Search query
          title: Search
        description: Search query
      - name: insight_types
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Insight types
          title: Insight Types
        description: Insight types
      - name: min_score
        in: query
        required: false
        schema:
          type: number
          description: Minimum relevance score
          default: 0.0
          title: Min Score
        description: Minimum relevance score
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 4999
          minimum: 1
          description: Max ranked ids to return. Defaults to full-corpus coverage, which is what a client filtering the whole catalog locally needs. A typeahead rendering a short list should pass its own row cap instead of asking for the corpus on every keystroke.
          default: 4999
          title: Limit
        description: Max ranked ids to return. Defaults to full-corpus coverage, which is what a client filtering the whole catalog locally needs. A typeahead rendering a short list should pass its own row cap instead of asking for the corpus on every keystroke.
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - type: object
              - type: 'null'
              title: Config
