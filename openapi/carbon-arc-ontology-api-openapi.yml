  /v2/ontology/insights/linked:
    get:
      tags:
      - Ontology
      summary: Linked Insight Ids
      description: 'Insight ids linked to the requested entity / event scope.


        The browser already holds the whole store from ``/all-insights``,

        so scoping a browse only needs graph adjacency: it intersects these ids

        with the corpus it has instead of refetching a listing. Adjacency is not

        user-specific — provider access is already applied to the store the ids

        are intersected with.


        Scopes AND together, the same way the paginated listing stacks its entity

        and event pre-filters. Adjacency does not vary with subject/topic/dataset

        filters, so those are not accepted here — the caller narrows the

        intersection it already holds.


        ``candidate_id`` asks the picker''s second question against the same

        intersection: which of the entities on screen would empty it. That belongs

        here rather than on the entity listing, which is response-cached across all

        of its filters — folding a per-selection answer into that key would give

        every distinct selection its own copy of every page, for one bit per row.'
      operationId: linked_insight_ids_v2_ontology_insights_linked_get
      parameters:
      - name: entity_id
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: integer
          - type: 'null'
          description: Entity carc_ids (paired with entity_representation)
          title: Entity Id
        description: Entity carc_ids (paired with entity_representation)
      - name: entity_representation
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Representations paired 1:1 with entity_id
          title: Entity Representation
        description: Representations paired 1:1 with entity_id
      - name: event_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: carc_id of an event EntityRepresentation (paired with event_representation).
          title: Event Id
        description: carc_id of an event EntityRepresentation (paired with event_representation).
      - name: event_representation
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Representation type of the event node (e.g. 'corpeventc').
          title: Event Representation
        description: Representation type of the event node (e.g. 'corpeventc').
      - name: event_category_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: carc_id of an EventCategory — insights linked to any event under it.
          title: Event Category Id
        description: carc_id of an EventCategory — insights linked to any event under it.
      - name: candidate_id
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: integer
          - type: 'null'
          description: carc_ids of entities being offered as additions to the scope (paired with candidate_representation). Each one is reported back in incompatible_entities if it shares no insight with the scope.
          title: Candidate Id
        description: carc_ids of entities being offered as additions to the scope (paired with candidate_representation). Each one is reported back in incompatible_entities if it shares no insight with the scope.
      - name: candidate_representation
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Representations paired 1:1 with candidate_id
          title: Candidate Representation
        description: Representations paired 1:1 with candidate_id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - type: object
              - type: 'null'
              title: Config
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightLinkedResponse'
        '404':
          detail: Not found
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
