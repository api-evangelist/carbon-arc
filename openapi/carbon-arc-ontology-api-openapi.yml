  /v2/ontology/insights:
    get:
      tags:
      - Ontology
      summary: Get Insights List
      description: 'Fetch insights, with pagination.

        Optimized for new builder workflow - only entity_id is required for filtering.

        When event_id is provided, only insights linked to that event are returned.

        When search + event_id are both provided, ES insight search is used treating

        event_id as entity_id and event_representation as entity_representation.'
      operationId: get_insights_list_v2_ontology_insights_get
      parameters:
      - name: entity_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Entity ID
          title: Entity Id
        description: Entity ID
      - name: entity_representation
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Entity Representation
          title: Entity Representation
        description: Entity Representation
      - name: entity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Entity Filter
          title: Entity
        description: Entity Filter
      - name: subject_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: integer
          - type: 'null'
          description: Subject IDs
          title: Subject Ids
        description: Subject IDs
      - name: topic_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: integer
          - type: 'null'
          description: Topic IDs
          title: Topic Ids
        description: Topic IDs
      - name: insight_types
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Insight types
          title: Insight Types
        description: Insight types
      - name: dataset_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Dataset IDs
          title: Dataset Ids
        description: Dataset IDs
      - name: event_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter insights to those linked to this event (carc_id of an event EntityRepresentation). ANDed with entity_id/entity_representation when both are provided.
          title: Event Id
        description: Filter insights to those linked to this event (carc_id of an event EntityRepresentation). ANDed with entity_id/entity_representation when both are provided.
      - name: event_representation
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Representation type of the event node (e.g. 'corpeventc'). Used alongside event_id to uniquely scope the event. When search is also provided, passed as entity_representation to ES.
          title: Event Representation
        description: Representation type of the event node (e.g. 'corpeventc'). Used alongside event_id to uniquely scope the event. When search is also provided, passed as entity_representation to ES.
      - name: event_category_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter insights to those linked to events of this category (carc_id of an EventCategory node).
          title: Event Category Id
        description: Filter insights to those linked to events of this category (carc_id of an EventCategory node).
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search term
          title: Search
        description: Search term
      - name: include_metadata
        in: query
        required: false
        schema:
          type: boolean
          description: Include full metadata (descriptions, timestamps, delay status)
          default: true
          title: Include Metadata
        description: Include full metadata (descriptions, timestamps, delay status)
      - name: min_score
        in: query
        required: false
        schema:
          type: number
          maximum: 1.0
          minimum: 0.0
          description: Minimum search score, between 0 and 1
          default: 0.0
          title: Min Score
        description: Minimum search score, between 0 and 1
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number for insights list
          default: 1
          title: Page
        description: Page number for insights list
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Number of insights per page
          default: 25
          title: Size
        description: Number of insights per page
      - name: sort_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(insight_label|subject_label|topic_label|insight_type_label|overview|coverage|insight_label_featured)$
          - type: 'null'
          description: Field to sort insights by (currently only 'label' is supported)
          default: insight_label
          title: Sort By
        description: Field to sort insights by (currently only 'label' is supported)
      - name: order
        in: query
        required: false
        schema:
          type: string
          pattern: ^(asc|desc)$
          description: Sort direction (asc/desc)
          default: asc
          title: Order
        description: Sort direction (asc/desc)
      - name: rand_seed
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Random seed for featured items
          title: Rand Seed
        description: Random seed for featured items
      - name: featured_insight_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: integer
          - type: 'null'
          description: Featured insight IDs
          title: Featured Insight Ids
        description: Featured insight IDs
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - type: object
              - type: 'null'
              title: Config
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightResponse'
        '404':
          detail: Not found
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/ontology/all-insights:
    get:
      tags:
      - Ontology
      summary: All Insights
      description: 'The whole insight corpus in one shot.


        Served from the in-process store so the builder fetches once and filters

        client-side. Unpaginated on purpose: the previous ``size=1000`` bulk reads

        silently truncated a corpus that has since passed 1,200. ``version`` is

        also the ETag, so a client holding it revalidates into a 304.


        Every insight, but not every field: provider-blocked rows are flagged with

        ``blocked: true`` per caller rather than dropped -- matching ``/insights``,

        which the browse panel renders locked and unselectable -- and the projection

        omits ``description``, ``subject_description`` and ``delay_status``.

        ``/insights`` remains the paginated, searchable listing with full metadata —

        it is the public SDK''s contract.


        Served from the published store; when nothing is published for the current

        ontology version the corpus is built live — but only for the response that

        actually needs the rows. A conditional request and an already-rendered body

        are both settled by the version alone, and a live build made to reach

        either was discarded whole.'
      operationId: all_insights_v2_ontology_all_insights_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightStoreResponse'
        '404':
          description: Not Found
          detail: Not found
  /v2/ontology/insights/batch:
    post:
      tags:
      - Ontology
      summary: Get Insights List Batch
      operationId: get_insights_list_batch_v2_ontology_insights_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_get_insights_list_batch_v2_ontology_insights_batch_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsBatchResponse'
        '404':
          description: Not Found
          detail: Not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/ontology/builder:
    get:
      tags:
      - Ontology
      summary: Get Builder Bootstrap
      description: 'Everything the builder needs on first paint, in one request.


        Unscoped this is the catalog landing. Scoped it is the first paint of a

        counterpart browse -- pass `insight_ids` when an Insight selection is

        stepping into entities, `entity_id` when an Entity is stepping into

        insights -- which collapses that transition''s list, count tree and

        taxonomy calls into the same single request the landing already uses.'
      operationId: get_builder_bootstrap_v2_ontology_builder_get
      parameters:
      - name: sections
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: 'Sections to include. Omit for all of: topics, categories, event_categories, entities_count_tree, entities, insights, all_insights, featured'
          title: Sections
        description: 'Sections to include. Omit for all of: topics, categories, event_categories, entities_count_tree, entities, insights, all_insights, featured'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          description: Page for the paginated sections
          default: 1
          title: Page
        description: Page for the paginated sections
      - name: size
        in: query
        required: false
        schema:
          type: integer
          description: Page size for the paginated sections
          default: 16
          title: Size
        description: Page size for the paginated sections
      - name: sort_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Sort key for the paginated sections. Predates this endpoint serving two lists at once: prefer entities_sort_by / insights_sort_by, which are validated per section. A key from the other section''s vocabulary is ignored for that section.'
          title: Sort By
        description: 'Sort key for the paginated sections. Predates this endpoint serving two lists at once: prefer entities_sort_by / insights_sort_by, which are validated per section. A key from the other section''s vocabulary is ignored for that section.'
      - name: entities_sort_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(label|entity_label_featured|coverage)$
          - type: 'null'
          description: Sort key for the `entities` section. Wins over sort_by.
          title: Entities Sort By
        description: Sort key for the `entities` section. Wins over sort_by.
      - name: insights_sort_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(insight_label|subject_label|topic_label|insight_type_label|overview|coverage|insight_label_featured)$
          - type: 'null'
          description: Sort key for the `insights` section. Wins over sort_by.
          title: Insights Sort By
        description: Sort key for the `insights` section. Wins over sort_by.
      - name: order
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Sort direction
          title: Order
        description: Sort direction
      - name: insight_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: integer
          - type: 'null'
          description: Scope the `entities` section to entities carrying every one of these insights. Same semantics as GET /v2/ontology/entities.
          title: Insight Ids
        description: Scope the `entities` section to entities carrying every one of these insights. Same semantics as GET /v2/ontology/entities.
      - name: entity_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Scope the `insights` section to this entity
          title: Entity Id
        description: Scope the `insights` section to this entity
      - name: entity_representation
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Representation for entity_id
          title: Entity Representation
        description: Representation for entity_id
      - name: event_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Scope both list sections to this event
          title: Event Id
        description: Scope both list sections to this event
      - name: event_representation
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Representation for event_id
          title: Event Representation
        description: Representation for event_id
      - name: event_category_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Scope both list sections to this event category
          title: Event Category Id
        description: Scope both list sections to this event category
      - name: entity
        in: query
        required: false
        schema:
          anyOf:
