    InsightSearchIdsResponse:
      properties:
        insight_ids:
          items:
            type: integer
          type: array
          title: Insight Ids
        total:
          type: integer
          title: Total
        truncated:
          type: boolean
          title: Truncated
          default: false
      type: object
      required:
      - insight_ids
      - total
      title: InsightSearchIdsResponse
      description: 'Semantically-matched insight ids, **in relevance order**.


        Same bargain as :class:`InsightLinkedResponse` — the client holds the

        catalog, so a search costs an id list rather than a hydrated listing, and

        no graph materialization happens on the search path.


        One difference, and it is load-bearing: these ids are ordered by the vector

        search''s fused ranking, so a client must map over them in order rather than

        filter its own corpus by membership. An adjacency filter can keep catalog

        order because nothing ranks it; a search result that loses its order looks

        broken even when the ids are right.


        ``truncated`` reports that the search returned as many hits as it was

        allowed, so lower-ranked matches were cut.'
    BuilderSection:
      properties:
        data:
          anyOf:
          - {}
          - type: 'null'
          title: Data
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        duration_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Duration Ms
      type: object
      title: BuilderSection
      description: 'One section of the builder''s first paint.


        ``data`` and ``error`` are exclusive. A section that fails carries the

        exception''s type name and leaves ``data`` null, so one bad section costs

        the caller that panel rather than the page.'
    EntityInsightsResponse:
      properties:
        entities:
          items:
            type: object
          type: array
          title: Entities
      type: object
      required:
