            type: string
          type: array
          title: Dataset Id
        description:
          type: string
          title: Description
        data:
          type: object
          title: Data
        topic_data_dictionary:
          anyOf:
          - items:
              type: object
            type: array
          - type: 'null'
          title: Topic Data Dictionary
        blocked:
          type: boolean
          title: Blocked
        blocked_api:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Blocked Api
        blocked_mcp:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Blocked Mcp
        public:
          type: boolean
          title: Public
        last_updated_timestamp:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Updated Timestamp
        is_current:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Current
        ontime_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Ontime Status
        subject_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject Id
        subject_label:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject Label
        has_confidence_report:
          type: boolean
          title: Has Confidence Report
      type: object
      required:
      - carc_id
      - category
      - subcategory
      - ecosystem_type
      - dataset_name
      - dataset_id
      - description
      - data
      - blocked
      - public
      - has_confidence_report
      title: DataLibrarySource
    PublicPrismsResponse:
      properties:
        tou:
          anyOf:
          - type: object
          - type: 'null'
          title: Tou
        prisms:
          items:
            type: object
          type: array
          title: Prisms
        arrays:
          items:
            type: object
          type: array
          title: Arrays
          default: []
        indexes:
          items:
            type: object
          type: array
          title: Indexes
          default: []
      type: object
      required:
      - prisms
      title: PublicPrismsResponse
      description: 'The precomputed snapshot the public marketing page renders. Only

        relative values (YoY index levels, share-of-group percentages) — never

        absolute dollars/visits/downloads.'
    ValidationError:
