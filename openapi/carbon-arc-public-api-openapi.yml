openapi: 3.2.0
info:
  title: Carbon Arc API Documentation Public API
  description: '# Introduction


    Carbon Arc''s Insights Exchange provides a comprehensive consumption-based platform for accessing decision-making data.'
  version: v2
  x-logo:
    url: /static/logo_light.png
tags:
- name: Public
paths:
  /v2/public-library/data-library:
    get:
      tags:
      - Public
      summary: Get public data identifiers (landing page)
      operationId: get_public_datalibrary_identifiers_v2_public_library_data_library_get
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - type: object
              - type: 'null'
              title: Config
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataLibrarySourcesResponse'
        '404':
          description: Not Found
          detail: Not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/public-library/explore-data:
    get:
      tags:
      - Public
      summary: Get public explore data assets (landing page)
      operationId: get_public_explore_data_v2_public_library_explore_data_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAssetsResponse'
        '404':
          description: Not Found
          detail: Not found
  /v2/public-prisms:
    get:
      tags:
      - Public
      summary: Get Prisms Page
      description: 'The public /prisms page payload. No auth, no per-user data, relative

        values only. Proxied from CAMS''s serving cache (CAMS owns prism state);

        serves the last-good copy if CAMS is briefly unreachable.


        Conditional. The page polls this so a recompute reaches a browser that is

        already open, and the payload is megabytes of series — so it carries an

        ETag over its own content and answers an unchanged poll with a 304.

        ``no-cache`` rather than a max-age: every request revalidates (nothing is

        ever served stale), but an unchanged one costs a round trip and no body.'
      operationId: get_prisms_page_v2_public_prisms_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPrismsResponse'
        '404':
          description: Not Found
          detail: Not found
components:
  schemas:
    ListAssetsResponse:
      properties:
        assets:
          items:
            $ref: '#/components/schemas/AssetResponse'
          type: array
          title: Assets
        total:
          type: integer
          title: Total
      type: object
      required:
      - assets
      - total
      title: ListAssetsResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    DataLibrarySource:
      properties:
        carc_id:
          type: integer
          title: Carc Id
        category:
